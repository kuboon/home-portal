name: deploy

# Deploys to Cloudflare Workers on every push to main. Inert until the repo
# variable D1_DATABASE_ID is set (see cloudflare/README.md); needs the secret
# CLOUDFLARE_API_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID. Set the
# variable HOME_PORTAL_DOMAIN only at cutover, to attach the custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HOME_PORTAL_DOMAIN: ${{ vars.HOME_PORTAL_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install cf CLI
        working-directory: cloudflare
        run: npm ci
      - name: Build (client assets, worker bundle, build output)
        run: deno task build:cloudflare
      - name: Apply D1 migrations
        working-directory: cloudflare
        run: npx cf d1 migrations apply "${{ vars.D1_DATABASE_ID }}" --dir ../packages/db/migrations
      - name: Deploy
        working-directory: cloudflare
        run: npx cf deploy --prebuilt
